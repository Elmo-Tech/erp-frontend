name: P0-01 Temporary Lockfile Bootstrap
on:
  push:
    branches: [task/p0-01-ci-baseline]
permissions:
  contents: write
jobs:
  generate:
    if: github.ref == 'refs/heads/task/p0-01-ci-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/p0-01-ci-baseline
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate authentic npm 10 lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate lock with npm ci and commit on task branch only
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          test -s package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(p0-01): pin npm dependency resolution"
          git push origin HEAD:refs/heads/task/p0-01-ci-baseline
