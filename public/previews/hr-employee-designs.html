<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee HR · Four design directions</title>
  <style>
    :root { --blue:#2757df; --ink:#202938; --muted:#738093; --line:#e7ebf1; --bg:#f5f7fb; --green:#158063; --radius:14px; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; }
    button,input,select,textarea { font:inherit; }
    button { cursor:pointer; }
    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible { outline:3px solid #9fb7ff; outline-offset:3px; }
    button { color:inherit; }
    .chooser { background:#192740; padding:18px 30px; color:white; }
    .chooser-top { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:13px; }
    .chooser h1 { font-size:17px; margin:0; }
    .chooser p { font-size:12px; margin:3px 0 0; color:#bfccdf; }
    .prototype { font-size:11px; color:#cfdaed; border:1px solid #516078; border-radius:30px; padding:5px 11px; white-space:nowrap; }
    .choices { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
    .choice { background:#26354f; border:1px solid #3b4b66; text-align:right; border-radius:10px; padding:11px 14px; color:#d6ddeb; }
    .choice strong { display:block; font-size:14px; }
    .choice small { display:block; color:#b0bfd6; margin-top:2px; font-size:11px; }
    .choice[aria-pressed="true"] { border-color:#92b0ff; background:#eaf0ff; color:#1a43ae; }
    .choice[aria-pressed="true"] small { color:#5b72a3; }
    .shell { display:grid; grid-template-columns:78px minmax(0,1fr); max-width:1540px; margin:auto; min-height:calc(100vh - 154px); }
    .rail { background:white; border-right:1px solid var(--line); padding:23px 14px; display:flex; align-items:center; flex-direction:column; gap:17px; }
    .logo { display:grid; place-items:center; width:38px; height:38px; background:var(--blue); color:white; font-weight:800; border-radius:12px; margin-bottom:14px; font-size:17px; }
    .rail-item { display:grid; place-items:center; width:43px; height:43px; border-radius:11px; color:#8895a8; }
    .rail-item.current { color:var(--blue); background:#ecf1ff; }
    .rail-bottom { margin-top:auto; padding-top:30px; }
    svg { width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none; }
    main { min-width:0; padding:26px 34px 36px; }
    .breadcrumb { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:10px; margin-bottom:19px; }
    .breadcrumb b { color:#4e5e74; font-weight:500; }
    .employee-header { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:24px; }
    .identity { display:flex; align-items:center; gap:15px; min-width:0; }
    .avatar { width:60px; height:60px; display:grid; place-items:center; border-radius:18px; background:#e1eafb; border:4px solid white; box-shadow:0 0 0 1px #d9e2f2; color:#3d609e; font-size:20px; font-weight:700; flex:none; }
    .identity h2 { margin:0 0 2px; font-size:25px; letter-spacing:-.6px; line-height:1.3; }
    .identity p { color:var(--muted); margin:0; font-size:12px; }
    .identity-line { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .badge { font-size:10px; font-weight:650; padding:4px 9px; border-radius:6px; background:#f0f3f8; color:#647288; white-space:nowrap; display:inline-flex; align-items:center; gap:5px; }
    .badge.green { background:#eaf7f1; color:#158063; }
    .badge.blue { background:#edf2ff; color:var(--blue); }
    .badge.orange { background:#fff6e8; color:#a46c14; }
    .badge.red { background:#fff0f1; color:#be4655; }
    .dot { width:5px; height:5px; border-radius:50%; background:currentColor; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; background:white; border:1px solid #dde3ed; border-radius:8px; padding:9px 13px; font-size:12px; font-weight:600; text-decoration:none; white-space:nowrap; }
    .btn svg { width:15px; height:15px; }
    .btn.primary { background:var(--blue); color:white; border-color:var(--blue); }
    .btn.soft { background:#edf2ff; border-color:#edf2ff; color:var(--blue); }
    .btn.quiet { background:transparent; border-color:transparent; color:var(--muted); }
    .buttons { display:flex; flex-wrap:wrap; gap:8px; }
    .tabs { display:flex; gap:26px; border-bottom:1px solid var(--line); margin-bottom:25px; overflow-x:auto; }
    .tab { border:0; background:transparent; display:flex; align-items:center; gap:8px; padding:12px 1px 14px; border-bottom:2px solid transparent; color:var(--muted); font-size:12px; font-weight:550; white-space:nowrap; }
    .tab svg { width:16px; height:16px; }
    .tab[aria-selected="true"] { color:var(--blue); border-bottom-color:var(--blue); }
    .section-heading { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:17px; }
    .section-heading h3 { margin:0; font-size:19px; letter-spacing:-.3px; }
    .section-heading p { margin:3px 0 0; font-size:12px; color:var(--muted); }
    .month { padding:8px 11px; border:1px solid #dde3ed; border-radius:8px; background:white; font-size:12px; color:#55657a; }
    .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:13px; margin-bottom:21px; }
    .stat { background:white; border:1px solid var(--line); border-radius:var(--radius); padding:18px; }
    .stat-label { font-size:11px; color:var(--muted); display:flex; justify-content:space-between; align-items:center; }
    .stat-label svg { color:#a2b1c7; width:16px; height:16px; }
    .stat-value { font-size:27px; font-weight:700; letter-spacing:-.8px; margin:9px 0 4px; line-height:1.2; }
    .stat-value small { font-size:12px; color:var(--muted); font-weight:400; letter-spacing:0; }
    .stat-note { font-size:10px; color:var(--muted); }
    .stat-note.green { color:var(--green); }
    .progress { height:5px; background:#edf0f6; border-radius:20px; overflow:hidden; margin:12px 0 6px; }
    .progress span { display:block; height:100%; width:85%; background:var(--blue); border-radius:20px; }
    .card { border:1px solid var(--line); border-radius:var(--radius); background:white; padding:20px; }
    .card h4 { margin:0; font-size:13px; }
    .card p { font-size:11px; color:var(--muted); margin:4px 0 0; }
    .card-header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:17px; }
    .actions { background:#edf2ff; border:1px solid #e1e9ff; border-radius:var(--radius); padding:13px 18px; display:flex; justify-content:space-between; align-items:center; gap:15px; margin-bottom:20px; }
    .actions h4 { font-size:12px; margin:0; color:#385787; }
    .actions p { font-size:10px; color:#6d81a6; margin:2px 0 0; }
    .action-btn { border:1px solid #d7e1fa; background:white; border-radius:8px; color:#395ba6; font-size:11px; font-weight:600; display:flex; gap:7px; align-items:center; padding:8px 12px; }
    .action-btn svg { width:14px; height:14px; }
    .two-col { display:grid; grid-template-columns:minmax(0,1.8fr) minmax(240px,1fr); gap:19px; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; text-align:left; font-size:11px; white-space:nowrap; }
    th { color:#8a96a7; font-weight:500; background:#fafbfd; padding:10px 12px; border-bottom:1px solid var(--line); }
    td { padding:13px 12px; border-bottom:1px solid #f0f2f6; color:#566477; }
    tbody tr:last-child td { border-bottom:0; }
    td:first-child { color:#36465d; font-weight:550; }
    .balance { padding:12px 0; border-bottom:1px solid #f0f2f6; }
    .balance:last-child { border-bottom:0; }
    .balance-line { display:flex; align-items:center; justify-content:space-between; font-size:11px; }
    .balance-line strong { font-size:12px; }
    .balance .progress { margin:8px 0 5px; height:4px; }
    .balance .progress span { width:29%; background:#82a6f5; }
    .balance p { font-size:10px; }
    .footnote { color:#8c98aa; font-size:10px; margin-top:16px; display:flex; align-items:center; gap:6px; }
    .footnote svg { width:13px; height:13px; }
    .side-layout { display:grid; grid-template-columns:210px minmax(0,1fr); gap:27px; align-items:start; }
    .side-nav { background:white; padding:11px; border:1px solid var(--line); border-radius:var(--radius); }
    .side-nav .tabs { flex-direction:column; gap:3px; margin:0; border:0; overflow:visible; }
    .side-nav .tab { width:100%; padding:12px; border:0; border-radius:8px; text-align:left; }
    .side-nav .tab[aria-selected="true"] { background:#edf2ff; }
    .side-note { border-top:1px solid var(--line); margin:15px 8px 0; padding-top:16px; color:var(--muted); font-size:10px; }
    .side-note strong { display:block; color:#44546c; font-size:11px; margin-bottom:3px; }
    .focus-content .stats { grid-template-columns:repeat(3,minmax(0,1fr)); gap:11px; }
    .focus-content .stat:nth-child(4) { display:none; }
    .focus-content .two-col { grid-template-columns:minmax(0,1fr); }
    .focus-content .two-col > .card:nth-child(2) { display:none; }
    .focus-content .actions { background:white; padding:16px; }
    .focus-content .section-heading h3 { font-size:22px; }
    .focus-content .card { padding:22px; }
    .command { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:25px; background:white; border:1px solid var(--line); border-radius:18px; margin-bottom:20px; }
    .command .identity h2 { font-size:24px; }
    .pill-tabs { border:0; background:#eaf0f7; padding:5px; border-radius:11px; width:max-content; max-width:100%; gap:4px; margin-bottom:25px; }
    .pill-tabs .tab { padding:9px 15px; border:0; border-radius:7px; font-size:11px; }
    .pill-tabs .tab[aria-selected="true"] { background:white; box-shadow:0 1px 5px #1b315d0d; }
    .action-tiles { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:13px; margin-bottom:24px; }
    .action-tile { text-align:left; border:1px solid var(--line); background:white; border-radius:var(--radius); padding:17px; display:flex; align-items:center; gap:12px; }
    .tile-icon { width:37px; height:37px; background:#eef3ff; border-radius:10px; display:grid; place-items:center; color:var(--blue); flex:none; }
    .action-tile:nth-child(2) .tile-icon { background:#edf8f3; color:var(--green); }
    .action-tile:nth-child(3) .tile-icon { background:#fff5e6; color:#c68e35; }
    .action-tile strong { display:block; font-size:12px; }
    .action-tile small { display:block; font-size:10px; color:var(--muted); margin-top:2px; }
    .action-tile > svg { width:14px; height:14px; margin-left:auto; color:#95a2b5; }
    .feed { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:11px; }
    .feed-item { border:1px solid var(--line); border-radius:10px; padding:15px; display:flex; justify-content:space-between; align-items:start; gap:12px; }
    .feed-item strong { display:block; font-size:12px; }
    .feed-item p { font-size:10px; }
    .feed-item .hours { font-size:17px; font-weight:650; }
    .feed-item .badge { margin-top:7px; }
    .timeline-header { padding-bottom:17px; border-bottom:1px solid var(--line); margin-bottom:22px; }
    .timeline-header .employee-header { margin-bottom:15px; }
    .timeline-strip { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:22px; background:white; border:1px solid var(--line); padding:17px 22px; border-radius:12px; }
    .timeline-strip h3 { margin:0; font-size:14px; }
    .timeline-strip p { margin:2px 0 0; color:var(--muted); font-size:10px; }
    .timeline-days { display:flex; align-items:center; gap:8px; }
    .day { width:35px; padding:6px 0; text-align:center; background:#f4f6fa; border-radius:7px; color:#8895a7; font-size:9px; }
    .day b { font-size:13px; display:block; color:#576981; }
    .day.active { background:var(--blue); color:#bbcbff; }
    .day.active b { color:white; }
    .timeline-layout { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(270px,1fr); gap:20px; }
    .timeline-entry { position:relative; display:grid; grid-template-columns:30px minmax(0,1fr) auto; gap:12px; padding:15px 0; }
    .timeline-entry::before { content:""; position:absolute; width:1px; background:#e8edf4; left:14px; top:42px; bottom:-16px; }
    .timeline-entry:last-child::before { display:none; }
    .event-icon { display:grid; place-items:center; width:30px; height:30px; color:var(--blue); background:#edf2ff; border:3px solid white; border-radius:50%; z-index:1; }
    .event-icon svg { width:14px; height:14px; }
    .timeline-entry strong { font-size:12px; display:block; }
    .timeline-entry small { font-size:10px; color:var(--muted); }
    .timeline-entry time { color:#8a97a9; font-size:10px; }
    .timeline-entry .badge { align-self:start; margin-top:5px; }
    .mini-summary { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:16px 0; }
    .mini-summary strong { display:block; font-size:25px; letter-spacing:-.5px; }
    .mini-summary small { color:var(--muted); font-size:10px; }
    .timeline-actions { display:flex; flex-direction:column; gap:9px; margin-top:18px; }
    .timeline-actions .btn { justify-content:flex-start; padding:12px 14px; }
    .contract-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:24px; margin:24px 0; }
    .contract-grid dt { font-size:11px; color:var(--muted); }
    .contract-grid dd { margin:5px 0 0; font-size:14px; font-weight:600; }
    .contract-banner { background:#edf2ff; border:1px solid #dfe8ff; border-radius:10px; padding:14px 17px; color:#426097; font-size:12px; display:flex; gap:10px; align-items:center; }
    .contract-banner svg { color:var(--blue); }
    .overview-grid { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(230px,1fr); gap:19px; }
    .big-progress { display:flex; align-items:center; gap:25px; margin:20px 0; }
    .ring { background:conic-gradient(var(--blue) 0 85%,#edf1f8 85% 100%); width:108px; height:108px; border-radius:50%; position:relative; display:grid; place-items:center; flex:none; }
    .ring::before { content:""; position:absolute; inset:9px; background:white; border-radius:50%; }
    .ring b { z-index:1; font-size:25px; }
    .big-progress h3 { font-size:24px; margin:0; }
    .big-progress p { font-size:12px; }
    .document { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:15px 0; border-bottom:1px solid var(--line); }
    .document:last-child { border:0; }
    .document strong { font-size:12px; }
    .document p { font-size:10px; }
    dialog { border:1px solid #dde4ef; border-radius:18px; width:520px; max-width:calc(100vw - 28px); max-height:calc(100dvh - 40px); padding:0; color:var(--ink); box-shadow:0 24px 100px #132d5438; }
    dialog::backdrop { background:#19274070; backdrop-filter:blur(3px); }
    .dialog-head { padding:22px 24px 17px; border-bottom:1px solid var(--line); display:flex; align-items:start; justify-content:space-between; gap:15px; }
    .dialog-head h3 { font-size:19px; margin:0; }
    .dialog-head p { font-size:11px; color:var(--muted); margin:4px 0 0; }
    .close { background:transparent; border:0; color:#8b97a7; padding:3px; }
    .dialog-body { padding:20px 24px; }
    .dialog-body label { display:block; font-size:12px; font-weight:550; margin-bottom:6px; }
    .dialog-body input,.dialog-body select,.dialog-body textarea { border:1px solid #dde4ef; padding:10px 12px; border-radius:8px; width:100%; background:white; color:#3e4d63; font-size:12px; }
    .field { margin-bottom:16px; }
    .field small { color:var(--muted); font-size:10px; display:block; margin-top:5px; }
    .field-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .dialog-foot { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:17px 24px; border-top:1px solid var(--line); background:#fafbfd; }
    .dialog-foot small { font-size:10px; color:var(--muted); }
    .notice { font-size:11px; background:#edf7f2; color:#287456; padding:12px 14px; border-radius:8px; display:flex; gap:9px; align-items:start; }
    .notice svg { width:15px; height:15px; }
    .report-sections { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:18px 0; }
    .report-sections span { font-size:11px; background:#f2f5fa; border-radius:7px; padding:10px; }
    .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1d2d46; color:white; border-radius:10px; padding:13px 20px; font-size:12px; z-index:5; box-shadow:0 8px 30px #1e325333; text-align:center; max-width:calc(100vw - 30px); }
    [hidden] { display:none !important; }
    .preview-footer { margin-top:24px; display:flex; justify-content:space-between; gap:12px; font-size:10px; color:#8b98aa; }
    @media (min-width:1440px) { main { padding-left:45px; padding-right:45px; } }
    @media (max-width:1100px) { .side-layout { grid-template-columns:185px minmax(0,1fr); gap:19px; } .focus-content .stat { padding:14px; } .focus-content .stat-value { font-size:24px; } .actions { align-items:start; flex-direction:column; } .timeline-days { gap:4px; } }
    @media (max-width:850px) { .rail { display:none; } .shell { display:block; } main { padding:22px; } .two-col,.timeline-layout,.overview-grid { grid-template-columns:minmax(0,1fr); } .side-layout { grid-template-columns:minmax(0,1fr); } .side-nav { padding:0; border:0; background:transparent; } .side-nav .tabs { flex-direction:row; overflow-x:auto; gap:4px; } .side-nav .tab { width:auto; } .side-note { display:none; } .timeline-days .day:nth-child(-n+3) { display:none; } .chooser { padding:16px 22px; } .action-tiles { gap:9px; } .action-tile { padding:12px; } .action-tile > svg { display:none; } }
    @media (max-width:600px) { .chooser { padding:14px; } .chooser-top { align-items:start; } .chooser h1 { font-size:14px; } .prototype { font-size:9px; padding:4px 7px; } .choices { grid-template-columns:1fr 1fr; gap:7px; } .choice { padding:9px 10px; } .choice strong { font-size:12px; } .choice small { font-size:10px; } main { padding:18px 15px; } .employee-header { flex-direction:column; align-items:start; gap:14px; } .identity h2 { font-size:21px; } .avatar { width:49px; height:49px; border-radius:13px; font-size:17px; } .tabs { gap:21px; margin-bottom:21px; } .tab { font-size:11px; } .stat { padding:15px; } .stats { grid-template-columns:1fr 1fr; gap:10px; } .stat-value { font-size:24px; } .focus-content .stats { grid-template-columns:1fr 1fr; } .focus-content .stat:nth-child(4) { display:block; } .section-heading { align-items:start; } .section-heading h3 { font-size:17px; } .section-heading p { max-width:195px; font-size:11px; } .actions { padding:14px; } .action-btn { font-size:10px; padding:8px 10px; } .command { padding:17px; align-items:start; flex-direction:column; gap:16px; } .action-tiles { grid-template-columns:1fr; } .action-tile { padding:13px; } .action-tile > svg { display:block; } .feed { grid-template-columns:1fr; } .timeline-strip { padding:14px; gap:10px; } .timeline-days .day:nth-child(-n+5) { display:none; } .day { width:29px; } .contract-grid { grid-template-columns:1fr 1fr; gap:18px; } .card { padding:17px; } .dialog-body { padding:18px; } .dialog-head,.dialog-foot { padding:17px 18px; } .dialog-foot small { max-width:115px; } .report-sections { gap:6px; } .preview-footer { flex-direction:column; } }
  </style>
</head>
<body>
  <div class="chooser">
    <div class="chooser-top">
      <div><h1>Employee HR / Design playground</h1><p dir="rtl">٤ اتجاهات مختلفة — جرّب التبويبات وأزرار الإضافة والتقرير قبل الاختيار</p></div>
      <span class="prototype">INTERACTIVE PREVIEW · SAMPLE DATA</span>
    </div>
    <div class="choices" dir="rtl" aria-label="Design directions">
      <button class="choice" data-design="1" aria-pressed="true"><strong>١ · مساحة هادئة <span style="font-size:10px">★ ترشيحي</span></strong><small>تبويبات واضحة · إحصائيات · جدول مرتب</small></button>
      <button class="choice" data-design="2" aria-pressed="false"><strong>٢ · تركيز جانبي</strong><small>قائمة جانبية · مساحة أوسع للعمل</small></button>
      <button class="choice" data-design="3" aria-pressed="false"><strong>٣ · كروت تفاعلية</strong><small>أزرار كبيرة · تفاصيل سهلة · طابع أخف</small></button>
      <button class="choice" data-design="4" aria-pressed="false"><strong>٤ · رحلة الشهر</strong><small>خط زمني · ملخص جانبي · تتبع الأحداث</small></button>
    </div>
  </div>
  <div class="shell">
    <aside class="rail" aria-label="Application context"><div class="logo">t.</div><div class="rail-item" data-icon="home"></div><div class="rail-item" data-icon="layers"></div><div class="rail-item current" data-icon="users"></div><div class="rail-item" data-icon="chart"></div><div class="rail-item rail-bottom" data-icon="settings"></div></aside>
    <main id="workspace"></main>
  </div>
  <dialog id="modal" aria-labelledby="modal-title" aria-describedby="modal-description"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script>
    const paths = {
      home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/>',

      if (event.target.closest('[data-close]')) {document.getElementById('modal').close();return;}

    });
    document.getElementById('modal').addEventListener('click',event=>{if(event.target===event.currentTarget){const rect=event.currentTarget.getBoundingClientRect();if(event.clientX<rect.left || event.clientX>rect.right || event.clientY<rect.top || event.clientY>rect.bottom)event.currentTarget.close();}});
    render();
  </script>
</body>
</html>
